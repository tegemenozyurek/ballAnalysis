[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-football-vision"
version = "0.1.0"
description = "Local real-time football match analysis overlay for macOS"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10.0",
    "mss>=9.0.1",
    "numpy>=1.26.0",
]

[project.scripts]
lfv = "live_football_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
